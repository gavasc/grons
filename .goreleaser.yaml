version: 2

project_name: gronma

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# .deb (Ubuntu/Debian) and .rpm (Fedora/RHEL/CentOS)
nfpms:
  - id: packages
    package_name: gronma
    vendor: gavasc
    homepage: https://github.com/gavasc/gronma
    maintainer: gavasc
    description: Terminal UI for managing cron jobs.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
